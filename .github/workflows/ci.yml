name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar dependencias exactas del package-lock.json
        run: npm ci

      - name: Compilar Tailwind
        run: npm run build

      - name: Validar el HTML
        run: npm run validar